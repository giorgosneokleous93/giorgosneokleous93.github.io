# This is a basic workflow to help you get started with Actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
     
      - name: Install Latest Hugo
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/latest -H "User-Agent: github-actions" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Latest Hugo version: $LATEST_VERSION"
          wget -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${LATEST_VERSION}/hugo_extended_${LATEST_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb
          hugo version
      
      - name: Deploy Website
        run: |
          git config --global user.email ''
          git config --global user.name 'Automated Builds from CI'
          ./deploy.sh 'Deploying Website to Production'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public